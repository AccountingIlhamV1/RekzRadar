name: Ambil berita
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ambil-berita
  cancel-in-progress: false
jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambil berita
        run: node fitur/berita/ambil.mjs
      - name: Simpan jika berubah
        run: |
          git config user.name "rekz-radar-bot"
          git config user.email "rekz-radar-bot@users.noreply.github.com"
          git add fitur/berita/data.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk disimpan."
          else
            git commit -m "Perbarui data berita"
            git pull --rebase
            git push
          fi
